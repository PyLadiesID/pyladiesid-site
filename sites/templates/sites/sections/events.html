{% load static %}

<div class="community-container">

    <div class="community-header">
        <span class="community-badge">Upcoming events</span>
        <h2 class="community-title">
            PyLadies in <span class="text-highlight">PyCon Indonesia 2026</span>
        </h2>
    </div>

    <div class="community-grid">
        <img style="margin:auto;" width="75%" src="{% static 'images/events/pycon2026.jpeg' %}">
        <aside class="join-card">
            <h3 class="join-title">PyLadies in Frame</h3>
            <h5 class="subtitle-pink">Capture Your PyCon Memories</h5>
            <p class="join-desc">
                Snap, frame, and share your favourite moments at Python Conference Indonesia.
            </p>
            <p class="join-desc">
                Find us at the booth · Take your shot · Show up in the gallery below
            </p>
            <a href="https://pyladiesinframe.id" target="_new" class="join-btn">The Wall of Memories &rarr;</a>
            <p class="join-connect">
                <a href="https://2026.pycon.id/">
                    <img width="100px" src="{% static 'images/events/pycon-logo-white.png' %}">
                </a>
            </p>
        </aside>

    </div>
</div>
